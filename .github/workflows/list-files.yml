name: List repository files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-files:
    runs-on: macos-latest

    steps:
      - name: Check out repository
      uses: actions/checkout@v6

      - name: List all tracked files
      shell: pwsh
      run: |
        Write-Host "Files in repository:"
        git ls-files
