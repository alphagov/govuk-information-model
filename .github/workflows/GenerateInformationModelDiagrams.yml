name: Generate Information Model Diagrams

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-information-model-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Java version
        run: java -version

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          dot -V

      - name: Create output directory
        run: mkdir -p Outputs/Diagrams

      - name: Run Saxon
        run: >
          java -jar "Tools/saxon-he-10.9.jar" -xsl:"XSLT/InformationModelDiagrams.xslt" -it:main rdf-folder="../RDF/"  output-folder="../Outputs/"

      - name: Move DOT files
        run: |
          find Outputs -maxdepth 1 -type f -name '*.dot' -exec mv -t Outputs/Diagrams/ {} +

      - name: Convert DOT files to SVG
        run: |
          shopt -s nullglob
          for file in Outputs/Diagrams/*.dot; do
            echo "Processing: $(basename "$file")"
            dot -Tsvg "$file" -o "${file%.dot}.svg"
          done

      - name: Show output files
        run: find Outputs -type f

      - name: Commit generated diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Outputs/Diagrams/
          if ! git diff --cached --quiet; then
            git commit -m "Generate Information Model diagrams"
            git push
          fi
