name: Generate Information Model Validation

on:
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  generate-information-model-validation:
    runs-on: ubuntu-latest
      
    steps:
        - name: Check out repository
          uses: actions/checkout@v6

        - name: Install Java
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: "21"

        - name: Check Java version
          run: java -version

        - name: Create output directory
          shell: bash
          run: mkdir -p Outputs

        - name: Run Saxon
          shell: bash
          run: >
            java -jar "Tools/saxon-he-10.9.jar" -xsl:"XSLT/InformationModelValidation.xslt" -it:main -o:"Outputs/InformationModelValidation.md"
            rdf-folder="../RDF/"

        - name: Show output files
          shell: bash
          run: find Outputs -type f

        - name: Commit generated validation results
          shell: bash
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Outputs/InformationModelValidation.md
            if ! git diff --cached --quiet; then
              git commit -m "Generate Information Model validation"
              git push
            fi
