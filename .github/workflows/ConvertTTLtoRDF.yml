name: Convert TTL to RDF

on:
  push:
    paths:
      - '*.ttl'
      - 'Domain/**/*.ttl'
      - 'Taxonomy/**/*.ttl'
      - 'ContentSchema/**/*.ttl'
      - '.github/workflows/ConvertTTLtoRDF.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Apache Jena
        shell: bash
        run: |
          JenaVersion="6.2.0"
          JenaArchive="apache-jena-${JenaVersion}.tar.gz"
          JenaUrl="https://dlcdn.apache.org/jena/binaries/${JenaArchive}"
          curl -L "$JenaUrl" -o "$JenaArchive"
          tar -xzf "$JenaArchive"

      - name: Set JENA_HOME
        shell: bash
        run: |
          JenaHome="$PWD/apache-jena-6.2.0"
          echo "JENA_HOME=$JenaHome" >> "$GITHUB_ENV"
          echo "$JenaHome/bin" >> "$GITHUB_PATH"
          export JENA_HOME="$JenaHome"
          echo "JENA_HOME=$JENA_HOME"

      - name: Create RDF directory
        shell: bash
        run: |
          mkdir -p RDF

      - name: Convert TTL files to RDF
        shell: bash
        run: |
          Jena="./apache-jena-6.2.0/bin/riot"

          TtlFolders=(
            "."
            "Domain"
            "Taxonomy"
            "ContentSchema"
          )

          for TtlFolder in "${TtlFolders[@]}"; do
            if [[ "$TtlFolder" == "." ]]; then
              FindCommand=(find . -maxdepth 1 -type f -name "*.ttl" -print)
            else
              if [[ -d "$TtlFolder" ]]; then
                FindCommand=(find "$TtlFolder" -type f -name "*.ttl" -print)
              else
                echo "Folder not found: $TtlFolder"
                continue
              fi
            fi

            while IFS= read -r File; do
              [[ -z "$File" ]] && continue
              FileName="$(basename "$File")"
              OutputFileName="${FileName%.ttl}.rdf"
              OutputPath="RDF/$OutputFileName"
              echo "Converting $File -> $OutputPath"
              "$Jena" --formatted=RDFXML "$File" > "$OutputPath"
            done < <("${FindCommand[@]}")
          done
          
          echo "Generated RDF files:"
          find RDF -type f -name "*.rdf" -print

      - name: Commit generated RDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RDF/
          if git diff --cached --quiet; then
            echo "No RDF changes"
          else
            git commit -m "Convert TTL files to RDF"
            git push
          fi
